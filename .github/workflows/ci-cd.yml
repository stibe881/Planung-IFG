name: CI/CD

on:
  push:
    branches:
      - main
      - claude/schueler-gespraeche-planung-8s76z9
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax- und Planer-Smoke-Test
        run: node tests/smoke.js

  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Website zusammenstellen
        run: |
          mkdir dist
          cp index.html dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
